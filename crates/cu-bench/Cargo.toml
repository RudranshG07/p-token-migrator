[package]
name = "cu-bench"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LiteSVM-based compute-unit benchmark harness for SPL Token, Token-2022, and p-token operations."

[[bin]]
name = "cu-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

litesvm = "0.6"
solana-sdk = "2.1"
spl-token = "7"
spl-token-2022 = { version = "7", features = ["no-entrypoint"] }
