[package]
name = "replay"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Forked-mainnet replay harness — fetches Solana mainnet transactions, forks the involved account state into LiteSVM, replays the transactions, and diffs the outcome against mainnet."

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

litesvm = "0.6"
solana-sdk = "2.1"

base64 = "0.22"
bs58 = "0.5"
ureq = { version = "2", features = ["json"] }
