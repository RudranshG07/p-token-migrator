name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release
      - name: Build sta
        run: cargo build -p solana-token-analyzer --release --target ${{ matrix.target }} --locked
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sta dist/
          tar -czf dist/sta-${{ matrix.target }}.tar.gz -C dist sta
          rm dist/sta
          (cd dist && shasum -a 256 sta-${{ matrix.target }}.tar.gz > sta-${{ matrix.target }}.tar.gz.sha256)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sta-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
