name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: cargo test --manifest-path cli/Cargo.toml
      - run: npm run cli -- scan samples/anchor-token-vault --summary
      - run: cargo test --manifest-path crates/p-token-shim-anchor/Cargo.toml
